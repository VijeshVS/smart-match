name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.29.2'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generate throwaway credentials so no secret-looking literal lives in CI.
      - name: Prepare test environment
        run: |
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=postgresql://talent:talent@localhost:5432/talent_auth"
            echo "REDIS_URL=redis://localhost:6379"
            echo "RABBITMQ_URL=amqp://talent:talent@localhost:5672"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify workspace Docker Compose
        run: docker compose --env-file .env.example config --quiet

  docker-build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            port: 5001
          - service: api-gateway
            port: 8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.service
          push: false
          load: true
          tags: talent-ai/${{ matrix.service }}:ci
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PATH=services/${{ matrix.service }}
            APP_PORT=${{ matrix.port }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint node talent-ai/${{ matrix.service }}:ci --version
