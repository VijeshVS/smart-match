name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title-and-body:
    name: Enforce PR title and body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || '';
            const body = pr.body || '';
            const errors = [];

            if (!/^release\([a-z0-9._/-]+\): .+/.test(title)) {
              errors.push(
                `Title must match "release(<scope>): <description>" (received: "${title}").`,
              );
            }

            if (body.trim().length === 0) {
              errors.push('Pull request body must not be empty.');
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            } else {
              core.info('Pull request title and body look good.');
            }
