version: "3.9"

# Phase 0: the legacy MongoDB instance is preserved under the rebranded
# talent.ai namespace. The full backing-service stack (PostgreSQL, Redis,
# RabbitMQ, Qdrant, MailHog) is added in Phase 1 as docker-compose.infra.yml.
services:
  mongodb:
    image: mongo:7
    container_name: talent-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - talent_ai_mongo_data:/data/db
    networks:
      - talent-ai-network

volumes:
  talent_ai_mongo_data:

networks:
  talent-ai-network:
    name: talent-ai-network

# MongoDB connection URL:
# mongodb://localhost:27017/talent_ai
