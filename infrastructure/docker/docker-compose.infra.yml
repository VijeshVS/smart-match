name: talent-ai-infra

# Phase 1.1 — backing infrastructure for the talent.ai microservices.
#
#   docker compose -f infrastructure/docker/docker-compose.infra.yml up -d
#
# Every datastore uses the `talent-ai-*` / `talent_ai_*` namespace. The legacy
# Phase 0 `docker-compose.yml` also publishes MongoDB on 27017, so run one stack
# at a time (or stop it before starting this one).

services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talent}
      POSTGRES_DB: ${POSTGRES_DB:-talent_auth}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - talent_ai_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-talent} -d ${POSTGRES_DB:-talent_auth}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - talent-ai-network

  mongodb:
    image: mongo:7
    container_name: talent-ai-mongodb
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - talent_ai_mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand(''ping'').ok"']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks:
      - talent-ai-network

  # One-shot helper that turns the standalone mongod into a single-node
  # replica set (required for MongoDB transactions / change streams).
  mongodb-init:
    image: mongo:7
    container_name: talent-ai-mongodb-init
    restart: 'no'
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ['mongosh', '--host', 'mongodb:27017', '--quiet', '/scripts/init-replica.js']
    volumes:
      - ./mongo/init-replica.js:/scripts/init-replica.js:ro
    networks:
      - talent-ai-network

  redis:
    image: redis:7-alpine
    container_name: talent-ai-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - talent_ai_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - talent-ai-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: talent-ai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-talent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-talent}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
      - '${RABBITMQ_PROMETHEUS_PORT:-15692}:15692'
    volumes:
      - talent_ai_rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - talent-ai-network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: talent-ai-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_HTTP_PORT:-6333}:6333'
      - '${QDRANT_GRPC_PORT:-6334}:6334'
    volumes:
      - talent_ai_qdrant_data:/qdrant/storage
    networks:
      - talent-ai-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    # MailHog only publishes linux/amd64 images. Pin the platform so Apple
    # Silicon hosts pull the right image and run it through Rosetta emulation.
    platform: linux/amd64
    container_name: talent-ai-mailhog
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    networks:
      - talent-ai-network

  # ── Datastore exporters (Prometheus) ──────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: talent-ai-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-talent}:${POSTGRES_PASSWORD:-talent}@postgres:5432/postgres?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'true'
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: 'false'
    ports:
      - '${POSTGRES_EXPORTER_PORT:-9187}:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talent-ai-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: talent-ai-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - '${REDIS_EXPORTER_PORT:-9121}:9121'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - talent-ai-network

  mongodb-exporter:
    image: percona/mongodb_exporter:0.42.0
    container_name: talent-ai-mongodb-exporter
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://mongodb:27017/?replicaSet=rs0'
      - '--discovering-mode'
      - '--collect-all'
      - '--compatible-mode'
    ports:
      - '${MONGODB_EXPORTER_PORT:-9216}:9216'
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - talent-ai-network

  # ── Observability ─────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: talent-ai-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${JAEGER_OTLP_GRPC_PORT:-4317}:4317'
      - '${JAEGER_OTLP_HTTP_PORT:-4318}:4318'
    networks:
      - talent-ai-network

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: talent-ai-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - talent_ai_prometheus_data:/prometheus
    networks:
      - talent-ai-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: talent-ai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/talent-platform-overview.json
      # Analytics PostgreSQL datasource (conversion funnels).
      ANALYTICS_DB_HOST: ${ANALYTICS_DB_HOST:-postgres}
      ANALYTICS_DB_PORT: ${ANALYTICS_DB_PORT:-5432}
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME:-talent_analytics}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-talent}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:-talent}
      ANALYTICS_DB_SSLMODE: ${ANALYTICS_DB_SSLMODE:-disable}
    ports:
      - '${GRAFANA_PORT:-3100}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - talent_ai_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - talent-ai-network

volumes:
  talent_ai_postgres_data:
    name: talent_ai_postgres_data
  talent_ai_mongo_data:
    name: talent_ai_mongo_data
  talent_ai_redis_data:
    name: talent_ai_redis_data
  talent_ai_rabbitmq_data:
    name: talent_ai_rabbitmq_data
  talent_ai_qdrant_data:
    name: talent_ai_qdrant_data
  talent_ai_prometheus_data:
    name: talent_ai_prometheus_data
  talent_ai_grafana_data:
    name: talent_ai_grafana_data

networks:
  talent-ai-network:
    name: talent-ai-network
