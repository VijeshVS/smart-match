apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: talent-ai

resources:
  - namespace.yaml
  - configmap.yaml
  - auth-service.yaml
  - talent-service.yaml
  - api-gateway.yaml
  - hpa.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: talent-ai
    includeSelectors: false

images:
  - name: ghcr.io/vijeshvs/smart-match/auth-service
    newTag: latest
  - name: ghcr.io/vijeshvs/smart-match/talent-service
    newTag: latest
  - name: ghcr.io/vijeshvs/smart-match/api-gateway
    newTag: latest
