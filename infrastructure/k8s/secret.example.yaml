# Template only — never commit real credentials.
#
#   kubectl -n talent-ai create secret generic talent-ai-secrets \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --from-literal=MONGODB_URI='mongodb://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=RABBITMQ_URL='amqp://...' \
#     --from-literal=JWT_ACCESS_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...'
#
# Or apply this file after replacing every placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: talent-ai-secrets
  labels:
    app.kubernetes.io/part-of: talent-ai
type: Opaque
stringData:
  DATABASE_URL: postgresql://talent:CHANGE_ME@postgres:5432/talent_auth
  RECRUITER_DATABASE_URL: postgresql://talent:CHANGE_ME@postgres:5432/talent_recruiter?schema=public
  ENGAGEMENT_DATABASE_URL: postgresql://talent:CHANGE_ME@postgres:5432/talent_engagement?schema=public
  REWARDS_DATABASE_URL: postgresql://talent:CHANGE_ME@postgres:5432/talent_rewards?schema=public
  ANALYTICS_DATABASE_URL: postgresql://talent:CHANGE_ME@postgres:5432/talent_analytics?schema=public
  MONGODB_URI: mongodb://talent:CHANGE_ME@mongodb:27017/talent_profiles?replicaSet=rs0
  NOTIFICATION_MONGODB_URI: mongodb://talent:CHANGE_ME@mongodb:27017/talent_notif?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  # Optional SMTP relay for branded notification email. Leave blank to render
  # messages into the log instead of sending them.
  SMTP_URL: ''
  RABBITMQ_URL: amqp://talent:CHANGE_ME@rabbitmq:5672
  JWT_ACCESS_SECRET: CHANGE_ME_32_CHARACTERS_MINIMUM_SECRET
  JWT_REFRESH_SECRET: CHANGE_ME_32_CHARACTERS_MINIMUM_SECRET
  # Optional AI provider / vector-store credentials. Leave blank to use the
  # deterministic local AI engine and an unauthenticated Qdrant instance.
  GROQ_API_KEY: ''
  GEMINI_API_KEY: ''
  OPENAI_API_KEY: ''
  QDRANT_API_KEY: ''
