apiVersion: v1
kind: ConfigMap
metadata:
  name: talent-ai-prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: talent-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        platform: talent-ai
        env: production

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: talent-services
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service:5001']
            labels: { service: auth-service, env: production }
          - targets: ['talent-service:5002']
            labels: { service: talent-service, env: production }
          - targets: ['recruiter-service:5003']
            labels: { service: recruiter-service, env: production }
          - targets: ['engagement-service:5004']
            labels: { service: engagement-service, env: production }
          - targets: ['rewards-service:5005']
            labels: { service: rewards-service, env: production }
          - targets: ['ai-matching-service:5006']
            labels: { service: ai-matching-service, env: production }
          - targets: ['notification-service:5007']
            labels: { service: notification-service, env: production }
          - targets: ['analytics-service:5008']
            labels: { service: analytics-service, env: production }
          - targets: ['api-gateway:8080']
            labels: { service: api-gateway, env: production }

      # Managed infrastructure may live outside the cluster. Point these at the
      # in-cluster Service names or the managed endpoints for your environment.
      - job_name: rabbitmq
        static_configs:
          - targets: ['rabbitmq:15692']
            labels: { env: production }

      - job_name: qdrant
        metrics_path: /metrics
        static_configs:
          - targets: ['qdrant:6333']
            labels: { env: production }

      - job_name: postgres
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels: { env: production }

      - job_name: redis
        static_configs:
          - targets: ['redis-exporter:9121']
            labels: { env: production }

      - job_name: mongodb
        static_configs:
          - targets: ['mongodb-exporter:9216']
            labels: { env: production }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: talent-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: talent-ai
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: talent-ai-prometheus-config
        - name: rules
          configMap:
            name: talent-ai-prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: talent-ai
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
