apiVersion: v1
kind: ConfigMap
metadata:
  name: talent-ai-grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: talent-ai
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: talent-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
      - name: Analytics PostgreSQL
        uid: talent-analytics-db
        type: postgres
        access: proxy
        url: $ANALYTICS_DB_HOST:$ANALYTICS_DB_PORT
        database: $ANALYTICS_DB_NAME
        user: $ANALYTICS_DB_USER
        isDefault: false
        editable: false
        jsonData:
          sslmode: $ANALYTICS_DB_SSLMODE
          postgresVersion: 1600
          timescaledb: false
        secureJsonData:
          password: $ANALYTICS_DB_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: talent-ai-grafana-dashboard-provider
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: talent-ai
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: talent-ai
        orgId: 1
        folder: talent.ai
        folderUid: talent-ai
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: talent-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: talent-ai
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: talent-ai-grafana-admin
                  key: admin-user
                  optional: true
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: talent-ai-grafana-admin
                  key: admin-password
                  optional: true
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/talent-platform-overview.json
            - name: ANALYTICS_DB_HOST
              value: postgres.talent-ai.svc.cluster.local
            - name: ANALYTICS_DB_PORT
              value: '5432'
            - name: ANALYTICS_DB_NAME
              value: talent_analytics
            - name: ANALYTICS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: talent-ai-secrets
                  key: ANALYTICS_DB_USER
                  optional: true
            - name: ANALYTICS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: talent-ai-secrets
                  key: ANALYTICS_DB_PASSWORD
                  optional: true
            - name: ANALYTICS_DB_SSLMODE
              value: require
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: '500m', memory: 512Mi }
      volumes:
        - name: datasources
          configMap:
            name: talent-ai-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: talent-ai-grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: talent-ai-grafana-dashboards
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: talent-ai
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
