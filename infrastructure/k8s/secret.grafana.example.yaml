# Template only — never commit real credentials.
#
#   kubectl -n talent-ai create secret generic talent-ai-grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='...'
#
# Grafana falls back to its image defaults when this secret is absent; create
# it before exposing Grafana outside the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: talent-ai-grafana-admin
  labels:
    app.kubernetes.io/part-of: talent-ai
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME
