version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: smart-match-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

# MongoDB connection URL to use in your .env:
# mongodb://localhost:27017/smartmatch
